name: Build DARK AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect Flutter Directory
        id: find-dir
        run: |
          if [ -d "dark ai/mobile" ]; then
            echo "dir=dark ai/mobile" >> $GITHUB_OUTPUT
          else
            echo "dir=mobile" >> $GITHUB_OUTPUT
          fi

      - name: Install Flutter Dependencies
        working-directory: ${{ steps.find-dir.outputs.dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.find-dir.outputs.dir }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dark-ai-release-apk
          path: ${{ steps.find-dir.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
